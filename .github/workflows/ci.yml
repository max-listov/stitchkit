# Branch and pull-request validation. Release tags are handled by release.yml
# only after this workflow has completed successfully for the exact commit SHA.
#
# The release-critical path is deliberately flat and capacity-aligned: one
# framework/Node/artifact job plus every starter mode/variant/browser group.
# GitHub's workflow conclusion is the fail-closed aggregate consumed by the
# exact-SHA publisher.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

# A newer branch/PR SHA supersedes the older result. Tag publication has its
# own non-cancellable concurrency boundary in release.yml.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Framework, Node and publication artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bun run smoke:node
      - run: bun run consumer-lane
      - name: Pack the exact validated publication inputs
        run: |
          mkdir -p release-artifacts
          (cd packages/core && bun pm pack --destination "$GITHUB_WORKSPACE/release-artifacts")
          (cd packages/create-stitchkit && bun pm pack --destination "$GITHUB_WORKSPACE/release-artifacts")
      - name: Verify the packed docs match the tree
        # `prepack` synchronises README/llms into the package — a divergence
        # here means a docs fix would ship stale, so it fails the build.
        run: |
          mkdir -p /tmp/pack-verify
          tar -xzf release-artifacts/stitchkit-*.tgz -C /tmp/pack-verify
          diff /tmp/pack-verify/package/README.md README.md
          diff /tmp/pack-verify/package/llms.txt packages/core/llms.txt
          diff /tmp/pack-verify/package/llms-full.txt packages/core/llms-full.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-packages
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 30

  starter:
    name: Starter ${{ matrix.mode }} / ${{ matrix.variant }} / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # v1.62.1-noble, pinned to the immutable multi-platform index. The image
    # carries the exact lockfile browser revisions and their system libraries,
    # so release latency cannot depend on eight live apt/browser provisions.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    strategy:
      fail-fast: false
      matrix:
        mode: [target, head]
        variant: [blank, repository]
        browser: [chromium, webkit]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Service containers share the job-container network and are addressed by
      # their service label, not through a host-published loopback port.
      STARTER_TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@postgres:5432/postgres
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BUN_VERSION: 1.3.14
      BUN_ARCHIVE_SHA512: ece55300abf07cf9926c85751e974ea15571e5545ce36ec6b8f3e77bddcdeaf93879004f21df675e664387dff319a28f75b56356d41265a7d6428523c77f14b7
      STARTER_LANE_MODE: ${{ matrix.mode }}
      STARTER_LANE_VARIANT: ${{ matrix.variant }}
      STARTER_LANE_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install the starter-pinned Bun runtime
        # setup-bun delegates ZIP extraction to a host `unzip` executable that
        # the intentionally lean Playwright image does not carry. The official
        # platform package is a tarball and its npm integrity is verified before
        # the binary enters PATH, with no apt/npm bootstrap.
        run: |
          archive="$RUNNER_TEMP/bun-linux-x64.tgz"
          curl --fail --silent --show-error --location \
            "https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-$BUN_VERSION.tgz" \
            --output "$archive"
          echo "$BUN_ARCHIVE_SHA512  $archive" | sha512sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          install --mode 0755 "$RUNNER_TEMP/package/bin/bun" /usr/local/bin/bun
          ln --symbolic /usr/local/bin/bun /usr/local/bin/bunx
          test "$(bun --version)" = "$BUN_VERSION"
          test "$(bunx --version)" = "$BUN_VERSION"
      # The lane creates and prepares its own disposable scaffold. Running the
      # repository prepare hook here would install/generate the persistent
      # template a second time without contributing to the isolated proof.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run one isolated starter surface
        run: bun scripts/starter-lane.ts "--mode=$STARTER_LANE_MODE" "--variant=$STARTER_LANE_VARIANT" "--browser=$STARTER_LANE_BROWSER"
