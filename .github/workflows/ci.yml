# CI + Release — one workflow for everything.
#
# Jobs:
#   ci          — lint, typecheck, test, build (every push/PR)
#   node-smoke  — Node 22 import check (after ci)
#   release     — npm publish + GitHub Release (only on v* tag)
#
# npm auth: OIDC trusted publishing — no token stored.
#
# ONE-TIME npm-side setup (required before the first automated release):
#   npmjs.com → package `stitchkit` → Settings → Trusted Publisher →
#   add a GitHub Actions publisher:
#     organization/user: max-listov
#     repository:        stitchkit
#     workflow filename: ci.yml
#   Until this is configured the "Publish to npm" step fails.
#
# Release flow:
#   1. bump `version` in packages/core/package.json
#   2. move CHANGELOG `[Unreleased]` into a new version section
#   3. commit, then: git tag vX.Y.Z && git push origin vX.Y.Z

name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        working-directory: packages/core
        run: bun run check

      - name: Test
        working-directory: packages/core
        run: bun test

      - name: Build
        working-directory: packages/core
        run: bun run build

  node-smoke:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: packages/core
        run: bun run build

      # Runs under `node` (not bun) against the built dist/. Imports every
      # server-side entrypoint — including stitchkit/server — and drives a real
      # serveNode HTTP + Socket.IO round-trip, so a Bun-only dependency that
      # leaks into a Node path fails CI here (bun test cannot catch it).
      - name: Node smoke test (HTTP + Socket.IO)
        working-directory: packages/core
        run: bun run smoke:node

      # Packs the built package and installs it into fixture apps that use it
      # through the published entrypoints only — the view a consumer has, which
      # the in-repo suite structurally cannot take. Catches a folded environment
      # read, a type named in a public signature but never exported, and a value
      # that never reaches a consumer hook.
      - name: Consumer lane (packed tarball, public entrypoints only)
        working-directory: packages/core
        run: bun run consumer-lane

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ci, node-smoke]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing requires npm >= 11.5.
      - name: Update npm
        run: npm install -g npm@11.5.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        working-directory: packages/core
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # `npm publish` runs `prepublishOnly` (copies the README, builds dist/).
      # OIDC auth is automatic — no NODE_AUTH_TOKEN.
      - name: Publish to npm
        working-directory: packages/core
        run: npm publish --provenance --access public

      - name: Extract changelog for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          echo "$BODY" > /tmp/release-notes.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "stitchkit $GITHUB_REF_NAME"
          --notes-file /tmp/release-notes.md
