# The timing-sensitive tests under a saturated CPU, every night (`scripts/load-lane.ts`).
# A diagnostic lane: it is not release evidence and gates nothing. A red run is a timing bound
# that does not hold under load — found here instead of beside another gate during a release.
name: Load

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    name: Timing-sensitive tests under load
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run load-lane
