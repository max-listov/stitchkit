# Tag-only publication. The npm trusted publisher must be configured for:
#   repository: max-listov/stitchkit
#   workflow: release.yml
#   environment: npm-production
#
# Tags:
#   vX.Y.Z                    publishes stitchkit
#   create-stitchkit-vX.Y.Z   publishes create-stitchkit
name: Release

on:
  push:
    tags: ['v*', 'create-stitchkit-v*']

permissions:
  contents: read

# Two racing tag pushes must serialise — a publish is not cancellable midway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned toolchain inside the trust boundary — never `latest` here.
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Validate tag, package version and release notes
        run: bun scripts/release-plan.ts preflight "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-plan.json"

      - name: Require successful CI for the exact release SHA
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin master
          bun scripts/release-plan.ts assert-head "$GITHUB_SHA" "$(git rev-parse origin/master)"
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=completed" \
            --jq ".workflow_runs" \
            | bun scripts/release-plan.ts select-ci-run "$GITHUB_SHA")"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-packages
          path: release-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run-id }}

      - name: Publish the validated tarball
        run: |
          PACKAGE="$(jq -r .packageName "$RUNNER_TEMP/release-plan.json")"
          VERSION="$(jq -r .version "$RUNNER_TEMP/release-plan.json")"
          NPM_MAJOR="$(npm --version | cut -d. -f1)"
          if [ "$NPM_MAJOR" -lt 11 ]; then
            echo "::error::npm 11.5+ is required for OIDC trusted publishing"
            exit 1
          fi
          TARBALL="$(find release-artifacts -maxdepth 1 -type f -name "$PACKAGE-$VERSION.tgz" -print -quit)"
          if [ -z "$TARBALL" ]; then
            echo "::error::validated tarball $PACKAGE-$VERSION.tgz is missing"
            exit 1
          fi
          EXPECTED_SHA="$(sha1sum "$TARBALL" | cut -d' ' -f1)"
          PUBLISHED_SHA="$(npm view "$PACKAGE@$VERSION" dist.shasum 2>/dev/null || true)"
          ACTION="$(bun scripts/release-plan.ts publish-action "$EXPECTED_SHA" "$PUBLISHED_SHA")"
          if [ "$ACTION" = "publish" ]; then
            npm publish "$TARBALL" --provenance --access public
          fi
          bun scripts/wait-for-npm-publication.ts "$PACKAGE" "$VERSION"

      - name: Create the GitHub release from the validated changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r .notes "$RUNNER_TEMP/release-plan.json" > "$RUNNER_TEMP/release-notes.md"
          PACKAGE="$(jq -r .packageName "$RUNNER_TEMP/release-plan.json")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json tagName --jq '.tagName' | grep -Fx "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$PACKAGE $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
